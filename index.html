<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tienda Bryemky</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"><style id="estilos">
/* Layout: una columna estrecha tipo app, catálogo en filas de "ficha de equipación", barra de pedido fija abajo */
:root{
  --bg:#f3f3f1;--surface:#ffffff;--ink:#0b0b0c;--muted:#5f6166;--line:#dedfe0;
  --accent:#0b0b0c;--accent-ink:#ffffff;--price:#ffffff;--price-bg:#0b0b0c;--gold:#d8b25a;
  --ok:#0f7a55;--ok-bg:#dcf3e9;--warn:#9a5b00;--warn-bg:#fdf0d6;--off:#6b7489;--off-bg:#e7eaf1;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  --grass1:#2f8f3a;--grass2:#2a8434;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0e;--surface:#17181a;--ink:#f2f2f0;--muted:#a3a5aa;--line:#2b2d31;
  --accent:#000000;--accent-ink:#ffffff;--price:#ffffff;--price-bg:#000000;--gold:#e2c06e;
  --ok:#4fd3a0;--ok-bg:#12352a;--warn:#f2b45a;--warn-bg:#3a2a10;--off:#98a3ba;--off-bg:#1f283a;--grass1:#1f6a2a;--grass2:#1b6025;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0e;--surface:#17181a;--ink:#f2f2f0;--muted:#a3a5aa;--line:#2b2d31;
  --accent:#000000;--accent-ink:#ffffff;--price:#ffffff;--price-bg:#000000;--gold:#e2c06e;
  --ok:#4fd3a0;--ok-bg:#12352a;--warn:#f2b45a;--warn-bg:#3a2a10;--off:#98a3ba;--off-bg:#1f283a;--grass1:#1f6a2a;--grass2:#1b6025;color-scheme:dark}
.cesped-on{background-color:var(--grass1);background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22260%22%20height%3D%22260%22%3E%3Cg%20opacity%3D%22.13%22%3E%3Cg%20transform%3D%22translate%2840%2046%29%22%3E%3Ccircle%20r%3D%2216%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Cpolygon%20points%3D%220%2C-6.7%206.4%2C-2.1%204.0%2C5.4%20-4.0%2C5.4%20-6.4%2C-2.1%22%20fill%3D%22%23fff%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28190%2070%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%3E%3Ccircle%20r%3D%2216%22/%3E%3Cpath%20d%3D%22M-16%200H16M0%20-16V16M-11.2%20-11.2Q0%200%20-11.2%2011.2M11.2%20-11.2Q0%200%2011.2%2011.2%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2896%20150%29%20rotate%28-12%29%22%3E%3Cpath%20d%3D%22M0%200V48%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Crect%20x%3D%220.0%22%20y%3D%220.0%22%20width%3D%227.5%22%20height%3D%227.5%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%220.0%22%20y%3D%2215.0%22%20width%3D%227.5%22%20height%3D%227.5%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%227.5%22%20y%3D%227.5%22%20width%3D%227.5%22%20height%3D%227.5%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2215.0%22%20y%3D%220.0%22%20width%3D%227.5%22%20height%3D%227.5%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2215.0%22%20y%3D%2215.0%22%20width%3D%227.5%22%20height%3D%227.5%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2222.5%22%20y%3D%227.5%22%20width%3D%227.5%22%20height%3D%227.5%22%20fill%3D%22%23fff%22/%3E%3Crect%20width%3D%2230%22%20height%3D%2222.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.5%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28170%20190%29%20scale%281%29%22%20fill%3D%22%23fff%22%3E%3Cpath%20d%3D%22M0%2014h8l6-6h14l4-4h10l2%204h10v4l8%202v4H0z%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2220%22%20r%3D%225%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2220%22%20r%3D%225%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28230%20230%29%22%3E%3Ccircle%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Cpolygon%20points%3D%220%2C-4.2%204.0%2C-1.3%202.5%2C3.4%20-2.5%2C3.4%20-4.0%2C-1.3%22%20fill%3D%22%23fff%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2830%20220%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%3E%3Ccircle%20r%3D%2211%22/%3E%3Cpath%20d%3D%22M-11%200H11M0%20-11V11M-7.7%20-7.7Q0%200%20-7.7%207.7M7.7%20-7.7Q0%200%207.7%207.7%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),repeating-linear-gradient(180deg,var(--grass1) 0 70px,var(--grass2) 70px 140px)}
.cesped-on .marca,.cesped-on .grupo>h2{color:#fff}
.cesped-on .hero h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.cesped-on .hero h1 span{color:#ffe14d}
.cesped-on .hero p{color:#eef8ee}
.cesped-on .info{background:var(--surface);border-style:solid}
.cesped-on .barra{background:linear-gradient(transparent,rgba(0,40,10,.45) 40%)}
.cesped-on .seg{border-color:transparent}
.escena{width:100%;height:auto;display:block;max-width:520px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
#app{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.marca{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{padding-block:22px 18px;display:grid;gap:10px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,76px);line-height:.88;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:46ch}
.aviso{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--warn-bg);color:var(--warn);padding:6px 12px;border-radius:999px;width:fit-content}
.grupo{display:grid;gap:8px;margin-top:22px}
.grupo>h2{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.prod{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px}
.prod-txt{min-width:0}
.prod h3{font-size:16px;font-weight:700;line-height:1.25}
.prod p{margin:2px 0 0;color:var(--muted);font-size:13px}
.precio{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;color:var(--price);background:var(--price-bg);padding:1px 9px;border-radius:7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:14px 18px;width:100%;font-size:16px;border-radius:12px}
.btn-wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-peligro{color:var(--price);border-color:var(--price-bg)}
.btn:disabled{opacity:.5;cursor:default}
.info{margin-top:28px;padding:16px;border-radius:var(--r);border:1px dashed var(--line);color:var(--muted);font-size:14px;display:grid;gap:4px}
.info b{color:var(--ink)}
.barra{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.barra .btn-pri{max-width:648px;margin:0 auto;display:flex;justify-content:space-between}
.velo{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-width:680px;margin:0 auto}
.sheet header{display:flex;align-items:center;gap:10px}
.sheet header h2{font-size:20px;flex:1;min-width:0}
.x{border:0;background:var(--off-bg);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
label,.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.campo{display:grid;gap:5px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;font-size:15px}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-width:46px;padding:8px 10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.tog small{color:var(--muted);font-weight:500;margin-left:auto}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.stepper output{font-weight:800;font-size:18px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.err{color:var(--price);font-weight:600;font-size:14px;margin:0}
.ok{color:var(--ok);font-weight:600;font-size:14px;margin:0}
.volver{border:0;background:none;color:var(--ink);font-weight:700;cursor:pointer;padding:10px 0}
.titulo{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}
.lineas{display:grid;gap:8px;margin-block:14px}
.linea{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.linea b{font-size:15px}
.linea .det{color:var(--muted);font-size:13px;grid-column:1}
.linea .imp{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.linea .quitar{grid-column:2;justify-self:end;border:0;background:none;color:var(--price);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px;border-top:2px solid var(--ink);margin-top:4px}
.total span{font-weight:700}
.total strong{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.form{display:grid;gap:12px;margin-top:8px}
.caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.codigo{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;letter-spacing:.04em}
pre.msg{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:13px;margin:0;max-height:220px;overflow:auto}
/* gestión */
.tabs{display:flex;gap:6px;margin-block:16px 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px}
.filtros button{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.filtros button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.ped-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ped-h .fecha{color:var(--muted);font-size:13px;margin-left:auto}
.ped ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.ped .cli{font-weight:700}
.ped .notas{color:var(--muted);font-size:13px}
.ped-f{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.ped-f select{width:auto;padding:7px 10px;font-size:14px}
.ped-f .tot{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;margin-right:auto}
.ped-f label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;cursor:pointer}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--off-bg);color:var(--off)}
.e-Nuevo{background:var(--price-bg);color:var(--price)}
.e-Confirmado,.e-Pedido{background:var(--warn-bg);color:var(--warn)}
.e-Enviado{background:#e3e9f7;color:#1d3a8a}
.e-Entregado{background:var(--ok-bg);color:var(--ok)}
.pagado{background:var(--ok-bg);color:var(--ok)}
.porcobrar{background:var(--warn-bg);color:var(--warn)}
.lista{display:grid;gap:10px;margin-top:10px}
.vacio{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.cat-fila{display:grid;grid-template-columns:1fr 84px;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cat-fila .ancho{grid-column:1/-1}
.cat-fila .fila2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.equipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:2px}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg2 button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);padding:8px 10px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.ligas{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chips.ligas button{flex:none;white-space:nowrap;font-size:13px}
.eq-cab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colores{display:flex;gap:4px;justify-content:center}
.colores input{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.kit-slot select{width:100%;padding:6px;font-size:12px}
@media (max-width:420px){.eq-cab{grid-template-columns:1fr}}
.eq{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;text-align:left;min-width:0}
.eq span:last-child{min-width:0;overflow-wrap:anywhere}
.eq img,.eq-ini{width:38px;height:38px;flex:none;border-radius:7px;object-fit:contain;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.eq[aria-pressed="true"],.kit[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.kits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kit,.kit-slot{display:grid;gap:6px;justify-items:center;align-content:start;padding:6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:12px;font-weight:700;text-align:center;min-width:0}
.kit{cursor:pointer}
.kit img,.kit-slot img,.kit-n{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:7px;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--muted);max-width:100%}
.kit-l{color:var(--muted);font-size:12px}
.kit-slot .btn{width:100%;padding:6px 4px;font-size:12px;cursor:pointer}
.kit-grande{width:100%;max-height:340px;object-fit:contain;border-radius:10px;background:var(--bg);margin-top:4px}
.pers{display:grid;grid-template-columns:1fr 90px;gap:10px}
.pers .ancho{grid-column:1/-1}
.gratis{background:var(--ok-bg);color:var(--ok);font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:4px;letter-spacing:.04em}
.qrcaja{justify-items:center;text-align:center;margin-top:6px}
.qrlink{display:block;background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line)}
.qrlink img{display:block;width:min(260px,70vw);height:auto;image-rendering:pixelated}
.ajustes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ajustes .ancho{grid-column:1/-1}
@media (max-width:420px){.resumen{grid-template-columns:1fr 1fr}.resumen .stat:last-child{grid-column:1/-1}.cat-fila .fila2{grid-template-columns:1fr 1fr}.cat-fila .fila2 .btn{grid-column:1/-1}.prod{grid-template-columns:1fr auto}.prod .btn-add{grid-column:1/-1}}

/* césped de la tienda */
#decor{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
#decor svg{width:100%;height:100%}
#app{position:relative;z-index:1}
body.cesped{background-color:#276b2d;background-image:radial-gradient(ellipse at 50% -5%,rgba(255,255,255,.12),transparent 55%),radial-gradient(ellipse at 50% 115%,rgba(0,0,0,.38),transparent 55%),repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 72px,rgba(0,0,0,.05) 72px 144px),linear-gradient(180deg,#2e7934,#22612a)}
body.cesped #decor{display:block}
.cesped .marca,.cesped .hero h1,.cesped .grupo>h2,.cesped .titulo,.cesped .volver,.cesped .total span,.cesped .total strong,.cesped .form label,.cesped .enviado-txt{color:#fff;text-shadow:none}
.cesped .grupo>h2{color:rgba(255,255,255,.85)}
.cesped .hero p,.cesped .form p{color:rgba(255,255,255,.7)!important}
.cesped .hero h1 span{color:#ffe14d}
.cesped .hero p,.cesped .form p{color:rgba(255,255,255,.92)!important}
.cesped .grupo>h2{letter-spacing:.16em}

.deportes{display:flex;flex-wrap:wrap;gap:8px}

.marca{font-weight:900;letter-spacing:.12em}
.hero h1{font-weight:900;letter-spacing:0}
.cesped .hero h1 span{color:var(--gold)}
.precio{font-style:normal;font-weight:800;border-radius:4px;padding:3px 10px;letter-spacing:.02em}
.btn{border-radius:6px;letter-spacing:.02em}
.btn-add{background:#0b0b0c;color:#fff;border-color:#0b0b0c;text-transform:uppercase;font-size:13px;font-weight:800;letter-spacing:.08em}
.btn-pri{border-radius:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.prod{border-radius:8px;border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.prod h3{font-weight:700;letter-spacing:-.005em}
.grupo>h2{font-weight:800}
.deportes span{background:rgba(0,0,0,.25);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.4);border-radius:2px;padding:5px 12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.aviso{border-radius:2px;background:#0b0b0c;color:var(--gold);border:1px solid rgba(216,178,90,.6);font-weight:600;letter-spacing:.04em}

function parsear(t){
  t=String(t||'').replace(/\*/g,'');
  var cod=(t.match(/BRY-[A-Z0-9]{4,8}/)||[])[0];
  var cli=((t.match(/Cliente:\s*(.+)/)||[])[1]||'').trim();
  var notas=((t.match(/Notas:\s*(.+)/)||[])[1]||'').trim();
  var items=[];
  t.split('\n').forEach(function(l){
    var m=l.match(/^\s*\d+\)\s*(.+)$/);if(!m)return;
    var p=m[1].split('|').map(function(s){return s.trim();});
    var it={producto:p[0],equipo:'',equipacion:'',talla:'',dorsal:'',cant:1,importe:0};
    p.slice(1).forEach(function(f){
      var v=f.replace(/^[^:]*:\s*/,'');
      if(/^Equipo:/i.test(f))it.equipo=v;
      else if(/^Equipaci[oó]n:/i.test(f))it.equipacion=v;
      else if(/^Talla:/i.test(f))it.talla=v;
      else if(/^Parches?:/i.test(f)){if(/^(s[ií]|no)$/i.test(v))it.parches=/^s/i.test(v);else it.parche=v;}
      else if(/^(Nombre y dorsal|Personalizaci[oó]n):/i.test(f))it.dorsal=v;
      else if(/^Cant:/i.test(f))it.cant=parseInt(v,10)||1;
      else if(/€\s*$/.test(f))it.importe=num(f);
    });
    items.push(it);
  });
  if(!cod||!items.length)return null;
  var tot=(t.match(/Total:\s*([\d.,]+)/)||[])[1];
  return {codigo:cod,cliente:cli,notas:notas,items:items,total:tot?num(tot):items.reduce(function(a,b){return a+b.importe;},0)};
}

  if(a==='cat-borrar-si'){st.cat.productos.splice(+b.getAttribute('data-i'),1);st.catBorrar=null;render();return;}
  if(a==='eq-nuevo'){st.cat.equipos.push({id:'e'+Date.now().toString(36),nombre:'',liga:st.gliga,col:JSON.parse(JSON.stringify(DEF_COL)),kits:{'1':'','2':'','3':''}});render();var es=$app.querySelectorAll('[data-e]');if(es.length)es[es.length-1].focus();return;}
  if(a==='eq-borrar-si'){st.cat.equipos.splice(+b.getAttribute('data-i'),1);st.catBorrar=null;render();return;}
  if(a==='quitar-foto'){var q=v.split(':');st.cat.equipos[+q[0]].kits[q[1]]='';render();return;}
  if(a==='liga-nueva'){var nn=limpio(st.nliga);if(!nn){st.catMsg='Escribe el nombre de la liga.';render();return;}var lid='l'+Date.now().toString(36);st.cat.ligas.push({id:lid,nombre:nn,tipo:st.ntipo||'europa'});st.gliga=lid;st.nliga='';st.catMsg='';render();return;}
  if(a==='publicar'){publicar();return;}
});
function seleccionar(){var el=document.getElementById('msg-txt');if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);st.copiado='';}

$app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.s&&st.sheet&&t.type!=='checkbox'){st.sheet[t.dataset.s]=t.value;return;}
  if(t.dataset.c){st[t.dataset.c]=t.value;guardarLocal();var en=document.getElementById('enviar');if(en)en.href=waHref();if(t.dataset.c==='cliente'&&limpio(t.value)){var er=document.getElementById('err-carrito');if(er)er.hidden=true;st.errCarrito='';}return;}
  if(t.dataset.g){st[t.dataset.g]=t.value;return;}
  if(t.dataset.col)return;
  if(t.dataset.e!=null){st.cat.equipos[+t.dataset.e].nombre=t.value;return;}
  if(t.dataset.a){st.cat.ajustes[t.dataset.a]=(t.dataset.a==='parches'||t.dataset.a==='dorsal')?(+t.value||0):t.value;return;}
  if(t.dataset.p!=null&&t.dataset.k&&t.tagName!=='SELECT'){var p=st.cat.productos[+t.dataset.p];p[t.dataset.k]=t.dataset.k==='precio'?(+t.value||0):t.value;return;}
});
$app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.s==='pers'&&st.sheet){st.sheet[t.dataset.s]=t.checked;render();if(t.dataset.s==='pers'&&t.checked){var pn=document.getElementById('f-pnombre');if(pn)pn.focus();}return;}
  if(t.dataset.p!=null&&t.dataset.k==='tallas'){st.cat.productos[+t.dataset.p].tallas=t.value;return;}
  if(t.dataset.foto){subirFoto(t);return;}
  if(t.dataset.gliga){st.gliga=t.value;render();return;}
  if(t.dataset.ntipo){st.ntipo=t.value;return;}
  if(t.dataset.eliga!=null){st.cat.equipos[+t.dataset.eliga].liga=t.value;render();return;}
  if(t.dataset.pat){var pa=t.dataset.pat.split(':'),te=st.cat.equipos[+pa[0]];if(!te.col)te.col={};if(!te.col[pa[1]])te.col[pa[1]]=DEF_COL[pa[1]].slice();te.col[pa[1]][0]=t.value;render();return;}
  if(t.dataset.col){var pc=t.dataset.col.split(':'),tc=st.cat.equipos[+pc[0]];if(!tc.col)tc.col={};if(!tc.col[pc[1]])tc.col[pc[1]]=DEF_COL[pc[1]].slice();tc.col[pc[1]][+pc[2]]=t.value;render();return;}
  if(t.dataset.estado){actualizar(t.dataset.estado,{estado:t.value});return;}
  if(t.dataset.pagado){actualizar(t.dataset.pagado,{pagado:t.checked});return;}
  if(t.dataset.nota){actualizar(t.dataset.nota,{nota_interna:t.value});return;}
});

function actualizar(id,campos){
  if(!st.db)return;
  st.db.doc('pedidos/'+id).update(campos).catch(function(){st.msg='No se pudo guardar el cambio en '+id+'. Inténtalo de nuevo.';st.msgOk=false;render();});
}
function registrar(){
  var r=parsear(st.pegar);
  if(!r){st.msg='No reconozco ese mensaje. Copia el mensaje completo del pedido, desde "Nuevo pedido BRY-…" hasta "Total".';st.msgOk=false;render();return;}
  var ya=(st.pedidos||[]).some(function(p){return p.id===r.codigo;});
  if(ya){st.msg='El pedido '+r.codigo+' ya estaba registrado.';st.msgOk=false;render();return;}
  r.fecha=new Date().toISOString();r.estado='Nuevo';r.pagado=false;r.nota_interna='';
  st.db.doc('pedidos/'+r.codigo).set(r).then(function(){st.pegar='';st.msg='Pedido '+r.codigo+' de '+(r.cliente||'cliente')+' guardado.';st.msgOk=true;st.filtro='Todos';render();},function(err){st.msg=err&&err.code==='quota_exceeded'?'El registro está lleno. Borra pedidos antiguos entregados para hacer sitio.':'No se pudo guardar. Inténtalo de nuevo.';st.msgOk=false;render();});
}

function pintarQR(){
  var img=document.getElementById('qr-web'),web=limpio(AJ.web);if(!img||!web)return;
  function hacer(){try{var q=window.qrcode(0,'M');q.addData(web);q.make();img.src=q.createDataURL(8,2);img.style.opacity='1';}catch(e){}}
  if(window.qrcode)return hacer();
  if(document.getElementById('qr-lib'))return;
  var sc=document.createElement('script');sc.id='qr-lib';sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';sc.onload=hacer;document.head.appendChild(sc);
}
function aDataURL(id){return fetch(foto(id)).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){return new Promise(function(ok,ko){var fr=new FileReader();fr.onload=function(){ok(fr.result);};fr.onerror=ko;fr.readAsDataURL(b);});});}
function exportar(){
  if(!st.dl)return;
  st.exp=true;st.expMsg='';render();
  var d=JSON.parse(JSON.stringify(DATA)),tareas=[],fallos=0;
  (d.equipos||[]).forEach(function(t){Object.keys(t.kits||{}).forEach(function(k){var id=t.kits[k];if(id&&!/^data:/.test(id))tareas.push(aDataURL(id).then(function(u){t.kits[k]=u;},function(){t.kits[k]='';fallos++;}));});});
  Promise.all(tareas).then(function(){
    var json=JSON.stringify(d).replace(/</g,'\\u003c');
    var html='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tienda '+esc(d.ajustes.tienda)+'</title><style>'+RESET+'</style>'+FONT_LINK+'<style id="estilos">'+document.getElementById('estilos').textContent+'</style></head><body><div id="app"></div><script type="application/json" id="tienda-datos">'+json+'<\/script><script id="programa">'+document.getElementById('programa').textContent+'<\/script></body></html>';
    return st.dl.save({filename:'index.html',data:html});
  }).then(function(){st.exp=false;st.expOk=true;st.expMsg='Archivo descargado. Súbelo a tu web para actualizar la tienda.'+(fallos?' Ojo: '+fallos+' foto(s) no se pudieron incluir.':'');render();},function(err){st.exp=false;st.expOk=false;st.expMsg=err&&err.code==='declined'?'Descarga cancelada.':'No se pudo descargar el archivo. Inténtalo de nuevo.';render();});
}
function documento(datos){
  var json=JSON.stringify(datos).replace(/</g,'\\u003c');
  var css=document.getElementById('estilos').textContent;
  var prog=document.getElementById('programa').textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Tienda '+esc(datos.ajustes.tienda)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="estilos">'+css+'</style>\n'+FONT_LINK+'\n<div id="app"></div>\n<script type="application/json" id="tienda-datos">'+json+'<\/script>\n<script id="programa">'+prog+'<\/script></body></html>';
}
function publicar(){
  var C=st.cat;
  var malo=C.productos.filter(function(p){return !limpio(p.nombre)||!(+p.precio>0)||!limpio(p.grupo);});
  if(malo.length){st.catMsg='Cada producto necesita nombre, sección y un precio mayor que 0.';render();return;}
  if(!Array.isArray(C.equipos))C.equipos=[];
  if(!Array.isArray(C.ligas))C.ligas=[];
  if(C.equipos.some(function(t){return !limpio(t.nombre);})){st.catMsg='Cada equipo necesita un nombre.';render();return;}
  if(Object.keys(st.subiendo).length){st.catMsg='Espera a que terminen de subirse las fotos.';render();return;}
  C.equipos.forEach(function(t){t.nombre=limpio(t.nombre);});
  if(String(C.ajustes.whatsapp).replace(/\D/g,'').length<10){st.catMsg='Revisa el número de WhatsApp: ponlo con el prefijo, por ejemplo 34637137006.';render();return;}
  if(!st.art){st.catMsg='No se puede publicar desde esta vista.';render();return;}
  C.productos.forEach(function(p){p.nombre=limpio(p.nombre);p.grupo=limpio(p.grupo);p.desc=limpio(p.desc);p.precio=+p.precio;});
  C.ajustes.whatsapp=String(C.ajustes.whatsapp).replace(/\D/g,'');
  C.ajustes.web=limpio(C.ajustes.web||'');
  st.pub=true;st.catMsg='';render();
  st.art.publish(documento(C)).catch(function(err){
    st.pub=false;
    st.catMsg=err&&err.code==='conflict'?'Se guardó otra versión a la vez; la página se recargará. Revisa y repite tus cambios.':(err&&(err.code==='not_writer'||err.code==='not_granted'))?'Esta vista no puede publicar cambios.':'No se pudo publicar. Inténtalo de nuevo en un momento.';
    render();
  });
}

render();

/* ---------- área de gestión: solo la propietaria ---------- */
(async function(){
  if(!window.claude||!window.claude.use)return;
  try{
    var user=await window.claude.use('user');
    if(!user)return;
    var esOwner=await user.canEdit();
    if(!esOwner)return;
    st.owner=true;
    if(location.hash==='#gestion')st.vista='gestion';
    render();
    st.art=await window.claude.use('artifact');
    st.assets=await window.claude.use('assets');
    st.dl=await window.claude.use('downloads');
    st.db=await window.claude.use('db');
    if(st.db){
      st.db.collection('pedidos').onSnapshot(function(s){
        st.pedidos=s.docs.map(function(d){var o=d.data();o.id=d.id;return o;}).sort(function(a,b){return String(b.fecha||'').localeCompare(String(a.fecha||''));});
        var act=document.activeElement;
        if(st.vista==='gestion'&&!(act&&act.id==='f-pegar'))render();
      },function(){st.dbErr='No se pudieron cargar los pedidos. Recarga la página.';render();});
    }
    render();
  }catch(e){}
})();
})();
